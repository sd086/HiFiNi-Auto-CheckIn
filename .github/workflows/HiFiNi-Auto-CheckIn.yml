name: HiFINI-Auto-CheckIn

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * *" # 北京时间上午06:30

permissions:
  contents: read    # 允许 checkout 代码

jobs:
  build:
    env:
      COOKIE: ${{ secrets.COOKIE }}
      HIFIHI_COOKIE: ${{ secrets.HIFIHI_COOKIE }}
      # 可选：账号密码登录（Cookie 失效时自动重新登录）
      # 格式：邮箱:密码:站点，多个用 & 分隔
      #   user@mail.com:pass:hifiti
      #   user@mail.com:pass:hifiti&user@mail.com:pass:hifihi
      HIFINI_ACCOUNT: ${{ secrets.HIFINI_ACCOUNT }}
      SERVER_CHAN: ${{ secrets.SERVER_CHAN }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      WXWORK_WEBHOOK: ${{ secrets.WXWORK_WEBHOOK }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
      GOTIFY_APP_TOKEN: ${{ secrets.GOTIFY_APP_TOKEN }}
      # 签到失败时让工作流变红，避免"一片绿但没签到"
      STRICT_FAIL: "true"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build and Run
        run: |
          set -o pipefail
          # 显式指定插件坐标与版本，避免 maven 按前缀解析插件时
          # 因仓库限流（429）而报 No plugin found for prefix 'exec'
          mvn -B -ntp org.codehaus.mojo:exec-maven-plugin:3.1.1:java \
            -Dexec.mainClass=cloud.ohiyou.HifiniApplication \
            -Dexec.cleanupDaemonThreads=false 2>&1 | tee run.log
          echo "----- 签到结果摘要 -----"
          grep -E "EXIT_CODE|签到统计|Cookie|自动签到|\[HiFi(Ti|Hi)\]" run.log || true
